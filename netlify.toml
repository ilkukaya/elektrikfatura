[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/hesapla"
  to = "/elektrik-fatura-hesaplama"
  status = 301

[[redirects]]
  from = "/elektrik-hesapla"
  to = "/elektrik-fatura-hesaplama"
  status = 301

[[redirects]]
  from = "/dogalgaz-hesapla"
  to = "/dogalgaz-fatura-hesaplama"
  status = 301

[[redirects]]
  from = "/su-hesapla"
  to = "/su-fatura-hesaplama"
  status = 301

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=14400, s-maxage=14400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://www.elektrikfatura.com; frame-src 'self' https://googleads.g.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self';"
