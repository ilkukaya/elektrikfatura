name: Daily Rebuild

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify rebuild
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl -X POST "$NETLIFY_BUILD_HOOK"
            echo "Netlify deploy hook triggered successfully"
          else
            echo "NETLIFY_BUILD_HOOK not set, skipping"
          fi
